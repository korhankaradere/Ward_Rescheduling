plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

application {                                  // ADD at the bottom: which class holds main()
    mainClass = 'app.Main'             // package + class name of your Main
}

run {                                          // ADD: so Scanner / keyboard input works when running
    standardInput = System.in                  // connect the console to the program's input
}